<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>MusicStorm Desktop Lyrics</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        padding: 12px 16px;
      }

      .lyric-line {
        text-align: center;
        padding: 4px 0;
        transition: all 0.3s ease;
        width: 100%;
      }

      .lyric-line.active {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
      }

      .lyric-line:not(.active) {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.5);
      }

      .no-lyric {
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
      }

      .track-info {
        margin-top: 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="no-lyric">播放歌曲后显示歌词</div>
    </div>
    <script type="module" src="/src/desktop-lyric.tsx"></script>
  </body>
</html>
