<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicStorm</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --muted: rgba(60, 60, 67, 0.55);
        --card: rgba(255, 255, 255, 0.72);
        --border: rgba(0, 0, 0, 0.08);
        --bar: rgba(0, 0, 0, 0.08);
        --bar-fill: #1d1d1f;
        --glow: rgba(120, 120, 128, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f7;
          --muted: rgba(235, 235, 245, 0.55);
          --card: rgba(28, 28, 30, 0.72);
          --border: rgba(255, 255, 255, 0.1);
          --bar: rgba(255, 255, 255, 0.12);
          --bar-fill: #f5f5f7;
          --glow: rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .shell {
        width: 360px;
        padding: 36px 32px 28px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow:
          0 24px 64px var(--glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(28px) saturate(1.4);
        -webkit-backdrop-filter: blur(28px) saturate(1.4);
        text-align: center;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--fg);
      }

      p {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: -0.01em;
      }

      .progress {
        margin: 28px auto 0;
        width: 148px;
        height: 3px;
        border-radius: 999px;
        background: var(--bar);
        overflow: hidden;
      }

      .progress > i {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: var(--bar-fill);
        animation: slide 1.15s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <img class="logo" src="./icon.png" alt="MusicStorm" draggable="false" />
      <h1>MusicStorm</h1>
      <p>正在准备你的音乐库…</p>
      <div class="progress" aria-hidden="true"><i></i></div>
    </div>
  </body>
</html>
