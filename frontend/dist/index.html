    <script>
      (function () {
        var KEY = "musicstorm-theme";
        var STYLE_KEY = "musicstorm-theme-style";
        var THEME_COLORS = {
          default: ["#f5f6f8", "#17181b"],
          minecraft: ["#e7e1cf", "#1d201a"],
          material: ["#f8fafd", "#111418"],
          windows: ["#f3f3f3", "#202020"],
          nord: ["#eceff4", "#242933"],
          sunset: ["#fbf1e8", "#241d1b"],
          forest: ["#eef2e8", "#1b241c"],
          monochrome: ["#f4f4f4", "#171717"],
        };
        function systemDark() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        function readStyle() {
          try {
            var value = window.localStorage.getItem(STYLE_KEY);
            return Object.prototype.hasOwnProperty.call(THEME_COLORS, value)
              ? value
              : "default";
          } catch (e) {
            return "default";
          }
        }
        function apply() {
          var stored = null;
          try {
            stored = window.localStorage.getItem(KEY);
          } catch (e) {
            /* 存储不可用时回退系统 */
          }
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : systemDark()
                ? "dark"
                : "light";
          var root = document.documentElement;
          var style = readStyle();
          root.classList.toggle("dark", resolved === "dark");
          root.dataset.theme = resolved;
          root.dataset.themeStyle = style;
          root.style.colorScheme = resolved;
          var colors = THEME_COLORS[style] || THEME_COLORS.default;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", colors[resolved === "dark" ? 1 : 0]);
          }
        }
        apply();
        // system 模式下跟随系统明暗切换
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function onSystemChange() {
          var stored = null;
          try {
            stored = window.localStorage.getItem(KEY);
          } catch (e) {
            /* ignore */
          }
          if (stored !== "light" && stored !== "dark") {
            apply();
          }
        }
        if (media.addEventListener) {
          media.addEventListener("change", onSystemChange);
        } else if (media.addListener) {
          media.addListener(onSystemChange);
        }
      })();
    </script>
