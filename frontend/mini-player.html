<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MusicStorm Mini Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        background: rgba(24, 24, 28, 0.92);
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 12px 32px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
      }

      #root button {
        outline: none;
        transition:
          background-color 140ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
          filter 140ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
          transform 100ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #root button:hover {
        filter: brightness(1.14);
      }

      #root button:active {
        transform: scale(0.94);
      }

      #root button:focus-visible,
      [role="slider"]:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.88);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        #root button {
          transition-duration: 1ms;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        #root {
          background: #18181c;
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="placeholder" style="width: 100%; text-align: center; color: rgba(255, 255, 255, 0.6); font-size: 13px;">
        播放歌曲后显示
      </div>
    </div>
    <script type="module" src="/src/mini-player.tsx"></script>
  </body>
</html>
