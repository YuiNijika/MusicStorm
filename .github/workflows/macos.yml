name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Universal macOS build and test
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # mediaplayer 的 Swift 桥接引用 macOS 16 MediaPlayer API；macos-15
      # runner 默认 Xcode 16.4 SDK 不包含这些符号，但镜像已预装 Xcode 26。
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # Universal binary：Apple Silicon + Intel
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build universal macOS app and DMG
        run: pnpm tauri build --debug --bundles app,dmg --target universal-apple-darwin
