name: Deploy Website to GitHub Pages

# website 子包有变更时自动构建，产物提交到仓库根 docs/ 目录，
# 由 GitHub Pages 的 "Deploy from a branch → /docs" 发布。
# 手动触发入口：Actions → Deploy Website to GitHub Pages → Run workflow。
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "player.html"
      - "vite.player.config.ts"
      - "src/**"
      - ".github/workflows/website-deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# 需要写权限把 docs/ 产物提交回仓库
permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build website and publish into docs/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBSITE_BASE: /

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # lockfile 过期时移除 --frozen-lockfile 重试
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter website build

      - name: Build web player (player.html)
        run: pnpm build:player

      - name: Stage build output into docs/
        # 先组装到唯一临时目录并校验关键产物，全部就绪后再原子替换 docs/：
        # 任何一步失败都不会破坏已发布的 docs/（线上网页版/官网保持旧版完整）
        run: |
          set -euxo pipefail
          ls -la dist/
          tmpdir="$(mktemp -d docs.tmp.XXXXXX)"
          cp -r website/dist/. "$tmpdir/"
          mkdir -p "$tmpdir/assets"
          cp -r dist/player.html dist/icon.png dist/icon.svg "$tmpdir/"
          cp -r dist/assets/player "$tmpdir/assets/"
          # 完整性校验：网页版入口与分包缺失即失败，避免"在线播放"入口丢失
          test -f "$tmpdir/player.html"
          test -d "$tmpdir/assets/player"
          test "$(find "$tmpdir/assets/player" -name '*.js' -print -quit)" != ""
          rm -rf docs
          mv "$tmpdir" docs

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          # 产物与上次一致时跳过提交，避免空 commit 死循环
          if git diff --cached --quiet; then
            echo "docs/ unchanged, skip commit"
          else
            git commit -m "chore(website): publish pages into docs/"
            git push
          fi
