name: Deploy Website to website branch

# website 子包有变更时自动构建，产物推送到独立 website 分支（GitHub Pages
# 从该分支发布），main 分支不再维护 docs/ 部署目录。
# 手动触发：Actions → Deploy Website to website branch → Run workflow。
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "player.html"
      - "vite.player.config.ts"
      - "src/**"
      - ".github/workflows/website-deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# 需要写权限推送 website 分支
permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish to website branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBSITE_BASE: /

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # lockfile 过期时移除 --frozen-lockfile 重试
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter website build

      - name: Build web player (player.html)
        run: pnpm build:player

      - name: Stage site into temp dir
        # 先组装到临时目录并校验关键产物，全部就绪后再发布：
        # 任何一步失败都不会污染已发布的 website 分支
        run: |
          rm -rf /tmp/ms-site
          mkdir -p /tmp/ms-site/assets
          cp -r website/dist/. /tmp/ms-site/
          cp -r dist/player.html dist/icon.png dist/icon.svg /tmp/ms-site/
          cp -r dist/assets/player /tmp/ms-site/assets/
          # 纯静态产物，禁用 Pages 的 jekyll 构建
          touch /tmp/ms-site/.nojekyll
          # 完整性校验：网页版入口与分包缺失即失败，避免"在线播放"入口丢失
          test -f /tmp/ms-site/player.html
          test -d /tmp/ms-site/assets/player
          test "$(find /tmp/ms-site/assets/player -name '*.js' -print -quit)" != ""
          test -f /tmp/ms-site/CNAME

      - name: Publish to website branch
        # orphan 分支整树替换 + force push：website 分支只保留当前产物，无历史包袱
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan website-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/ms-site/. .
          git add -A
          git commit -m "chore(website): publish pages"
          git push origin HEAD:website --force
