<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f5f5f7" />
    <title>MusicStorm · 网页版在线音乐播放器</title>
    <script>
      (function () {
        var KEY = "musicstorm-theme";
        function systemDark() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        function apply() {
          var stored = null;
          try {
            stored = window.localStorage.getItem(KEY);
          } catch (e) {
            /* 存储不可用时回退系统 */
          }
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : systemDark()
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.dataset.theme = resolved;
        }
        apply();
        // system 模式下跟随系统明暗切换
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function onSystemChange() {
          var stored = null;
          try {
            stored = window.localStorage.getItem(KEY);
          } catch (e) {
            /* ignore */
          }
          if (stored !== "light" && stored !== "dark") {
            apply();
          }
        }
        if (media.addEventListener) {
          media.addEventListener("change", onSystemChange);
        } else if (media.addListener) {
          media.addListener(onSystemChange);
        }
      })();
    </script>
    <style>#boot-loading{z-index:9999;-webkit-user-select:none;user-select:none;background:radial-gradient(130% 130% at 50% 26%,#fafafa 0%,#f2f2f4 55%,#ecedef 100%);place-items:center;font-family:-apple-system,BlinkMacSystemFont,SF Pro Text,Segoe UI,system-ui,sans-serif;display:grid;position:fixed;inset:0;overflow:hidden}#boot-loading .hero{text-align:center;flex-direction:column;align-items:center;max-width:min(86vw,560px);padding:0 24px;animation:.6s cubic-bezier(.16,1,.3,1) both boot-hero-in;display:flex}#boot-loading .logo{object-fit:cover;border-radius:22px;width:88px;height:88px;margin-bottom:30px;box-shadow:0 18px 40px #00000024,0 2px 6px #0000000f}#boot-loading h1{letter-spacing:-.04em;color:#1d1d1f;margin:0;font-size:clamp(34px,6vw,46px);font-weight:700;line-height:1.04}#boot-loading p{letter-spacing:-.01em;color:#3c3c439e;margin:14px 0 0;font-size:15px}#boot-loading .progress{background:#00000014;border-radius:999px;width:168px;height:3px;margin-top:40px;overflow:hidden}#boot-loading .progress>i{border-radius:inherit;background:#1d1d1f;width:42%;height:100%;animation:1.15s ease-in-out infinite boot-slide;display:block}html[data-theme=dark] #boot-loading{background:radial-gradient(130% 130% at 50% 26%,#1e1e20 0%,#19191b 55%,#151517 100%)}html[data-theme=dark] #boot-loading h1{color:#f5f5f7}html[data-theme=dark] #boot-loading p{color:#ebebf594}html[data-theme=dark] #boot-loading .progress{background:#ffffff1f}html[data-theme=dark] #boot-loading .progress>i{background:#f5f5f7}@keyframes boot-hero-in{0%{opacity:0;transform:translateY(10px)scale(.985)}to{opacity:1;transform:translateY(0)scale(1)}}@keyframes boot-slide{0%{transform:translate(-120%)}to{transform:translate(280%)}}@media (prefers-reduced-motion:reduce){#boot-loading .hero{animation:none}#boot-loading .progress>i{animation-duration:3.5s}}</style>
    <script type="module" crossorigin src="./assets/player/player-BVQREIWV.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/player/rolldown-runtime-Dd_uD5pT.js">
  </head>

  <body>
    <div id="boot-loading">
      <div class="hero">
        <img class="logo" src="icon.png" alt="MusicStorm" draggable="false" />
        <h1>MusicStorm</h1>
        <p>正在加载网页版…</p>
        <div class="progress" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
