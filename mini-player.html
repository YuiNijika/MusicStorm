<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>MusicStorm Mini Player</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        background: rgba(24, 24, 28, 0.92);
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="placeholder" style="width: 100%; text-align: center; color: rgba(255, 255, 255, 0.6); font-size: 13px;">
        播放歌曲后显示
      </div>
    </div>
    <script type="module" src="/src/mini-player.tsx"></script>
  </body>
</html>
